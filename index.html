<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>Stillcut</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <h1>Stillcut</h1>
        <p>Extract every video frame locally in your browser.</p>
      </div>
    </header>
    <section class="panel">
      <div id="dropzone" class="dropzone" tabindex="0">
        <input id="fileInput" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" hidden>
        <strong>Drop a video here</strong>
        <span>or</span>
        <button id="chooseBtn" class="primary" type="button">Choose video</button>
        <small>MP4, WebM, MOV</small>
      </div>
      <div id="videoInfo" class="info hidden">
        <div><b>ความยาววิดีโอ</b><span id="duration">—</span></div>
        <div><b>จำนวนเฟรมของวิดีโอ</b><span id="frameCount">—</span></div>
        <div><b>FPS</b><span id="fps">—</span></div>
      </div>
      <video id="video" controls playsinline preload="metadata" class="hidden"></video>
      <div id="controls" class="controls hidden">
        <button id="extractBtn" class="primary" type="button">Extract all frames</button>
        <button id="stopBtn" class="secondary" type="button" disabled>Stop</button>
        <button id="zipBtn" class="secondary" type="button" disabled>Download ZIP</button>
      </div>
      <div id="progressWrap" class="hidden">
        <div class="progress"><div id="progressBar"></div></div>
        <div class="progressText" id="progressText">0%</div>
      </div>
    </section>
    <section id="gallery" class="gallery"></section>
    <p id="status" class="status"></p>
  </main>
  <div id="previewModal" class="preview-modal hidden" role="dialog" aria-modal="true" aria-label="Frame preview">
    <div class="preview-backdrop" id="previewBackdrop"></div>
    <div class="preview-box">
      <button id="previewClose" class="preview-close" type="button" aria-label="Close preview">×</button>
      <button id="previewPrev" class="preview-nav preview-prev" type="button" aria-label="Previous frame">‹</button>
      <img id="previewImage" class="preview-image" alt="Frame preview">
      <button id="previewNext" class="preview-nav preview-next" type="button" aria-label="Next frame">›</button>
      <div id="previewCaption" class="preview-caption"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
